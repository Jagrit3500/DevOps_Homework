<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Docker Multi-Stage Build</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      margin: 0;
      background: #090d16;
      color: #f8fafc;
    }
    .card {
      text-align: center;
      padding: 3rem;
      background: #111827;
      border-radius: 16px;
      box-shadow: 0 20px 35px rgba(0,0,0,0.6);
      border: 1px solid #1f2937;
      max-width: 600px;
    }
    h1 {
      color: #38bdf8;
      font-size: 2rem;
      margin-bottom: 1rem;
    }
    p {
      color: #9ca3af;
      font-size: 1.1rem;
      line-height: 1.6;
    }
    .badge {
      display: inline-block;
      background: linear-gradient(135deg, #2563eb, #7c3aed);
      color: white;
      padding: 6px 16px;
      border-radius: 9999px;
      font-size: 0.9rem;
      font-weight: 600;
      margin-top: 1.5rem;
    }
  </style>
</head>
<body>
  <div class="card">
    <h1>🚀 Hello World from Docker multi-stage build</h1>
    <p>This application was compiled and built using a multi-stage Dockerfile and deployed to a minimal production runtime environment.</p>
    <span class="badge">Running on Port 8080 • Docker Multi-Stage Build</span>
  </div>
</body>
</html>
